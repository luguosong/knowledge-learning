<style>
#mcp-stateless-observer { color:var(--foreground); }
#mcp-stateless-observer .mcp-route { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:12px; margin:20px 0; }
#mcp-stateless-observer .mcp-route > div:first-child { text-align:left; }
#mcp-stateless-observer .mcp-route > div:last-child { text-align:right; }
#mcp-stateless-observer .mcp-route span { display:block; }
#mcp-stateless-observer strong { font-weight:500; }
#mcp-stateless-observer pre { white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; max-width:100%; margin:14px 0; }
#mcp-stateless-observer #mcp-direction { color:var(--viz-series-1); font-weight:500; }
#mcp-stateless-observer #mcp-detail { margin-top:10px; }
#mcp-stateless-observer .mcp-meta { background:color-mix(in srgb,var(--viz-series-1) 10%,transparent); }
</style>
<script>
(() => {
  const root = document.getElementById('mcp-stateless-observer');
  const trace = JSON.parse(root.querySelector('#mcp-trace-data').textContent);
  const steps = trace.steps;
  const find = selector => root.querySelector(selector);
  const savedIndex = state => {
    const value = state?.privateContent?.step;
    return Number.isInteger(value) ? Math.max(0, Math.min(value, steps.length - 1)) : 0;
  };
  let index = savedIndex(window.openai?.widgetState);
  const code = find('#mcp-code');
  function render() {
    const step = steps[index];
    find('#mcp-position').textContent = `${index + 1} / ${steps.length}`;
    find('#mcp-title').textContent = step.title;
    find('#mcp-process').textContent = step.pid ? `进程 ${step.generation} · PID ${step.pid}` : '进程 1 已退出';
    find('#mcp-direction').textContent = step.kind === 'request' ? '请求 →' : step.kind === 'response' ? '← 响应' : '重启';
    find('#mcp-route').setAttribute('aria-label', step.kind === 'request' ? '客户端发送请求到服务器' : step.kind === 'response' ? '服务器返回响应到客户端' : '原服务器退出，随后启动全新服务器');
    find('#mcp-wire-label').textContent = step.kind === 'restart' ? '进程事件／不属于 MCP 报文' : 'JSON 格式化展示／线上每条为一行，以换行符结束';
    find('#mcp-detail').textContent = step.note;
    find('#mcp-prev').disabled = index === 0;
    find('#mcp-next').disabled = index === steps.length - 1;
    code.replaceChildren();
    if (step.kind === 'restart') {
      code.textContent = '客户端保存的上一结果：5\n旧服务器：已退出\n新服务器：未收到任何历史请求\n下一条：直接 tools/call(a=5, b=10)';
      return;
    }
    const pretty = JSON.stringify(JSON.parse(step.wire), null, 2);
    const lines = pretty.split('\n');
    lines.forEach((line, lineIndex) => {
      const span = document.createElement('span');
      if (line.includes('io.modelcontextprotocol/protocolVersion') || line.includes('io.modelcontextprotocol/clientCapabilities')) span.className = 'mcp-meta';
      span.textContent = line + (lineIndex === lines.length - 1 ? '' : '\n');
      code.append(span);
    });
  }
  function move(delta) {
    index = Math.max(0, Math.min(index + delta, steps.length - 1));
    render();
    const step = steps[index];
    if (window.openai?.setWidgetState) window.openai.setWidgetState({
      modelContent:{protocolVersion:trace.protocolVersion, transport:'stdio', selectedStep:step.title, serverGeneration:step.generation},
      privateContent:{step:index}
    }).catch(() => {});
  }
  find('#mcp-prev').addEventListener('click', () => move(-1));
  find('#mcp-next').addEventListener('click', () => move(1));
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) { index = savedIndex(event.detail.globals.widgetState); render(); }
  });
  render();
})();
</script>
