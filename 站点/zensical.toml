site_name = "知识学习"
site_url = "https://luguosong.github.io/knowledge-learning/"

plugins = ["awesome-nav"]

[theme]
language = "zh"
features = [
  "navigation.tabs",
  "navigation.top",
]

[[theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"

[theme.palette.toggle]
icon = "lucide/moon"
name = "切换到暗色"

[[theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "orange"

[theme.palette.toggle]
icon = "lucide/sun"
name = "切换到亮色"
