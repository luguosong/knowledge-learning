site_name = "知识学习"
site_url = "https://luguosong.github.io/knowledge-learning/"

extra_css = [
  "fonts/lxgwwenkai-regular.css",
  "fonts/lxgwwenkai-bold.css",
  "fonts/lxgwwenkaimono-regular.css",
  "fonts/lxgwwenkaimono-bold.css",
  "stylesheets/lxgw.css",
  "stylesheets/diagrams.css",
]

plugins = ["awesome-nav"]

[markdown_extensions]
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "fold" } }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[theme]
language = "zh"
font = false
features = [
  "navigation.tabs",
  "navigation.top",
]

[[theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"

[theme.palette.toggle]
icon = "lucide/moon"
name = "切换到暗色"

[[theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "orange"

[theme.palette.toggle]
icon = "lucide/sun"
name = "切换到亮色"
